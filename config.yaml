# Conversation gap threshold (hours) — messages after this gap count as a new conversation
conversation_gap_hours: 15

# Minimum word length for SHOUTING detection (all-caps words)
min_caps_word_length: 3

# Manners keywords — polite words/phrases to count
# Use \s? for optional spaces, \s for required spaces (regex fragments)
manners_words:
  - "thank\\s?you"
  - thanks
  - thankyou
  - thx
  - ty
  - tysm
  - tyvm
  - sorry
  - sry
  - apologies
  - "my\\s?bad"
  - mb
  - please
  - plz
  - pls
  - welcome
  - yw
  - np
  - "no\\s?problem"
  - "no\\s?worries"
  - "excuse\\s?me"
  - pardon

# Word analysis
top_words_count: 20

# Emoji analysis
top_emojis_per_person: 5
top_emojis_overall: 10

# Date format: null = auto-detect, "MDY" or "DMY"
date_format: null

# Chart styling
chart_style:
  figure_width: 10
  figure_height: 6
  color_palette:
    - "#4C72B0"
    - "#DD8452"
    - "#55A868"
    - "#C44E52"
    - "#8172B3"
    - "#937860"
    - "#DA8BC3"
    - "#8C8C8C"
  font_size: 12
  title_size: 14
  dpi: 150

# Directories
output_dir: output
chats_dir: chats

# Include appendices (first messages + longest messages full text)
include_appendix: true
